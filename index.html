<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="每日一报 — 科技前沿速览，汇集前沿科技突破、科技应用落地与企业动态">
<title>每日一报 · 科技速览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--sx:4px;--sm:8px;--md:16px;--lg:24px;--xl:32px;--x2:48px;--x3:64px;
--tx:clamp(.625rem,.6rem+.125vw,.7rem);--ts:clamp(.75rem,.72rem+.15vw,.833rem);
--tb:clamp(.875rem,.84rem+.18vw,1rem);--tm:clamp(1rem,.95rem+.25vw,1.125rem);
--tl:clamp(1.125rem,1.05rem+.375vw,1.333rem);--tx1:clamp(1.333rem,1.2rem+.67vw,1.777rem);
--tx2:clamp(1.777rem,1.55rem+1.13vw,2.369rem);--td:clamp(3.157rem,2.5rem+3.3vw,4.209rem);
--fs:1;
--ink:oklch(18% .01 60);--ink2:oklch(38% .01 60);--ink3:oklch(55% .01 60);
--pp:oklch(97% .008 70);--sf:oklch(99% .004 70);--sh:oklch(94% .008 70);
--bd:oklch(88% .01 70);--bdl:oklch(92% .006 70);--ac:oklch(52% .18 25);
--at:oklch(55% .15 240);--aa:oklch(52% .16 160);--ae:oklch(55% .15 40);
--up:oklch(52% .18 25);--dn:oklch(50% .16 160);--fl:oklch(55% .01 60);
--shs:0 1px 2px oklch(0% 0 0/.04);--shm:0 2px 8px oklch(0% 0 0/.06);--shl:0 4px 24px oklch(0% 0 0/.08);
--ee:cubic-bezier(.19,1,.22,1);--eq:cubic-bezier(.25,1,.5,1);
--df:150ms;--dn:300ms;--ds:500ms;
--sw:260px;--hh:80px;--mw:860px;
}
[data-theme="dark"]{
--ink:oklch(92% .005 70);--ink2:oklch(72% .008 70);--ink3:oklch(58% .01 70);
--pp:oklch(14% .01 260);--sf:oklch(18% .01 260);--sh:oklch(22% .012 260);
--bd:oklch(28% .01 260);--bdl:oklch(22% .008 260);
--shs:0 1px 2px oklch(0% 0 0/.2);--shm:0 2px 8px oklch(0% 0 0/.3);--shl:0 4px 24px oklch(0% 0 0/.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--fs));scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans SC","DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:var(--tb);line-height:1.65;color:var(--ink);background:var(--pp);min-height:100dvh;transition:background var(--dn) var(--ee),color var(--dn) var(--ee);overflow-x:hidden}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Header */
.sh{position:sticky;top:0;z-index:100;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:var(--md) var(--xl);background:var(--sf);border-bottom:1px solid var(--bdl);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);min-height:var(--hh);box-shadow:var(--shs);transition:background var(--dn) var(--ee),border-color var(--dn) var(--ee)}
.hl{display:flex;align-items:center;gap:var(--md)}
.ww{display:flex;align-items:center;gap:var(--sm);font-size:var(--ts);color:var(--ink2);white-space:nowrap}
.wi{font-size:var(--tl);line-height:1}.wt{font-weight:700;color:var(--ink);font-size:var(--tm)}
.wl{color:var(--ink3);font-size:var(--tx)}.wd{width:1px;height:24px;background:var(--bd)}
.cw{display:flex;flex-direction:column}
.ct{font-family:"DM Sans","Noto Sans SC",system-ui,sans-serif;font-size:var(--tl);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.cd{font-size:var(--tx);color:var(--ink3);line-height:1.2}
.hc{display:flex;justify-content:center;align-items:center}
.st{font-family:"Noto Serif SC","SimSun","STSong",serif;font-size:var(--td);font-weight:900;color:var(--ink);letter-spacing:.08em;line-height:1;position:relative;user-select:none;transition:color var(--dn) var(--ee)}
.st::after{content:"";position:absolute;bottom:-6px;left:10%;width:80%;height:3px;background:linear-gradient(90deg,var(--at),var(--aa) 50%,var(--ae));border-radius:2px}
.hr{display:flex;justify-content:flex-end}
/* Settings */
.stg{position:fixed;top:var(--md);right:var(--xl);z-index:200;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--ink);font-size:var(--tl);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--df) var(--ee);box-shadow:var(--shs);letter-spacing:.1em}
.stg:hover{background:var(--sh);box-shadow:var(--shm)}
.stg.rot{transform:rotate(90deg)}
@media(hover:hover){.stg:hover{transform:rotate(90deg)}}
.sp{position:fixed;top:0;right:-320px;width:300px;height:100dvh;z-index:190;background:var(--sf);border-left:1px solid var(--bd);padding:var(--x2) var(--lg);display:flex;flex-direction:column;gap:var(--xl);transition:right var(--ds) var(--ee);box-shadow:var(--shl)}
.sp.is-open{right:0}
.so{position:fixed;inset:0;z-index:185;background:oklch(0% 0 0/.3);opacity:0;pointer-events:none;transition:opacity var(--dn) var(--ee)}
.so.is-visible{opacity:1;pointer-events:auto}
.sp h3{font-family:"Noto Serif SC",serif;font-size:var(--tl);font-weight:700;color:var(--ink);margin-bottom:var(--sx)}
.sg{display:flex;flex-direction:column;gap:var(--sm)}
.sg label{font-size:var(--ts);color:var(--ink2);font-weight:500}
.sg input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--bd);outline:none}
.sg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ac);cursor:pointer;border:2px solid var(--sf);box-shadow:var(--shs)}
.ttb{display:flex;align-items:center;gap:var(--sm);padding:var(--sm) var(--md);border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--ink);font-size:var(--ts);cursor:pointer;transition:all var(--df) var(--ee);font-family:inherit}
.ttb:hover{background:var(--sh);border-color:var(--ink3)}
.ttb .tci{font-size:var(--tm)}.fsv{font-family:"DM Sans",monospace;font-size:var(--ts);color:var(--ac);font-weight:700;text-align:right}
/* Layout */
.pw{max-width:calc(var(--mw) + var(--sw) + var(--x2) + var(--xl)*2);margin:0 auto;display:grid;grid-template-columns:1fr var(--sw);gap:var(--x2);padding:var(--lg) var(--xl);align-items:start}
.ca{display:flex;flex-direction:column;gap:var(--x2);min-width:0}
/* Sidebar */
.sb{position:sticky;top:calc(var(--hh) + var(--lg));display:flex;flex-direction:column;gap:var(--lg);max-height:calc(100dvh - var(--hh) - var(--x2));overflow-y:auto}
.wfb{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:var(--md);display:flex;flex-direction:column;gap:var(--sm)}
.wfb h4{font-family:"Noto Serif SC",serif;font-size:var(--ts);font-weight:700;color:var(--ink2);letter-spacing:.05em;padding-bottom:var(--sx);border-bottom:1px solid var(--bdl)}
.wfc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:60px}
.wfi{padding:3px 10px;border-radius:3px;font-size:var(--tx);font-weight:500;white-space:nowrap;line-height:1.4}
.sep{background:var(--sf);border:1px solid var(--bd);border-radius:4px;display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:300px}
.sep h4{font-family:"Noto Serif SC",serif;font-size:var(--ts);font-weight:700;color:var(--ink2);padding:var(--sm) var(--md);border-bottom:1px solid var(--bdl);letter-spacing:.05em;position:sticky;top:0;background:var(--sf);z-index:1}
.sel{list-style:none;overflow-y:auto;flex:1}
.sei{display:grid;grid-template-columns:1fr auto;align-items:center;padding:var(--sm) var(--md);border-bottom:1px solid var(--bdl);font-size:var(--tx);transition:background var(--df) var(--ee)}
.sei:hover{background:var(--sh)}.sen{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.sec{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:55px}
.sec.up{color:var(--up)}.sec.down{color:var(--dn)}.sec.flat{color:var(--fl)}
/* Overview */
.ov{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:var(--xl);position:relative;overflow:hidden}
.ov::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--at),var(--aa) 50%,var(--ae))}
.oh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--lg);padding-bottom:var(--md);border-bottom:1px solid var(--bdl)}
.oh h2{font-family:"Noto Serif SC",serif;font-size:var(--tx1);font-weight:700;color:var(--ink);letter-spacing:.04em}
.od{font-size:var(--tx);color:var(--ink3)}
.og{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--lg)}
.oc{display:flex;flex-direction:column;gap:var(--sm)}
.oc h3{font-family:"Noto Serif SC",serif;font-size:var(--tm);font-weight:700;color:var(--ink);display:flex;align-items:center;gap:var(--sx)}
.oc h3 .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.tech{background:var(--at)}.dot.app{background:var(--aa)}.dot.ent{background:var(--ae)}
.oc p{font-size:var(--ts);color:var(--ink2);line-height:1.7}
/* Tabs */
.ns{display:flex;flex-direction:column}
.nn{display:flex;border-bottom:2px solid var(--bd)}
.nt{flex:1;padding:var(--sm) var(--md);border:none;background:none;font-family:"Noto Serif SC",serif;font-size:var(--tm);font-weight:700;color:var(--ink3);cursor:pointer;position:relative;transition:color var(--df) var(--ee);letter-spacing:.04em;text-align:center}
.nt::after{content:"";position:absolute;bottom:-2px;left:20%;width:60%;height:2px;transform:scaleX(0);transition:transform var(--dn) var(--ee)}
.nt:hover{color:var(--ink)}.nt.is-active{color:var(--ink)}.nt.is-active::after{transform:scaleX(1)}
.nt:nth-child(1).is-active::after{background:var(--at)}.nt:nth-child(2).is-active::after{background:var(--aa)}.nt:nth-child(3).is-active::after{background:var(--ae)}
.nc{padding-top:var(--lg);display:none;flex-direction:column;gap:var(--md)}.nc.is-visible{display:flex}
/* News Cards */
.ni{display:grid;grid-template-columns:200px 1fr;gap:0;border:1px solid var(--bdl);border-radius:4px;background:var(--sf);transition:all var(--df) var(--ee);cursor:pointer;text-decoration:none;color:inherit;overflow:hidden}
.ni:hover{border-color:var(--bd);box-shadow:var(--shm)}
/* card with image */ .ni.has-img{grid-template-columns:200px 1fr}
/* card without image */ .ni.no-img{grid-template-columns:1fr}
.ni-img{width:200px;height:130px;object-fit:cover;flex-shrink:0;display:block;background:var(--bdl)}
.ni-body{display:flex;flex-direction:column;gap:var(--sx);justify-content:center;min-width:0;padding:var(--md)}
.ni.has-img .ni-body{padding-left:var(--lg)}
.ni-body h4{font-size:var(--tm);font-weight:700;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni-body p{font-size:var(--ts);color:var(--ink2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni-body p.ni-sum-fallback{font-size:var(--ts);color:var(--mut);font-style:italic}
.ni-meta{display:flex;align-items:center;gap:var(--sm);flex-wrap:wrap}
.ni-tag{display:inline-block;font-size:var(--tx);padding:1px 6px;border-radius:2px;font-weight:500}
.ni-tag.tech{background:oklch(55% .15 240/.1);color:var(--at)}.ni-tag.app{background:oklch(52% .16 160/.1);color:var(--aa)}.ni-tag.ent{background:oklch(55% .15 40/.1);color:var(--ae)}
.ni-src{font-size:10px;padding:1px 5px;border-radius:2px;background:var(--bdl);color:var(--ink3)}
/* Footer */
.sf{text-align:center;padding:var(--x2);border-top:1px solid var(--bdl);margin-top:var(--x2);color:var(--ink3);font-size:var(--tx)}
/* Responsive */
@media(max-width:1100px){
.pw{grid-template-columns:1fr;gap:var(--lg);padding:var(--md)}
.sb{position:static;flex-direction:row;gap:var(--md);max-height:none;overflow-y:visible}
.wfb{flex:1}.sep{flex:1;max-height:300px}.og{grid-template-columns:1fr;gap:var(--md)}
}
@media(max-width:640px){
.sh{grid-template-columns:1fr;grid-template-rows:auto auto;gap:var(--sm);padding:var(--sm) var(--md)}
.hl{order:2;justify-content:center}.hc{order:1}.st{font-size:var(--tx2)}
.ni.has-img{grid-template-columns:1fr}.ni-img{width:100%;height:160px}
.ni.has-img .ni-body{padding-left:var(--md)}
.pw{padding:var(--sm)}.sb{flex-direction:column}.sp{width:260px;right:-280px}
}
@keyframes fiu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.ni{animation:fiu var(--ds) var(--ee) both}
.ni:nth-child(1){animation-delay:0ms}.ni:nth-child(2){animation-delay:50ms}.ni:nth-child(3){animation-delay:100ms}.ni:nth-child(4){animation-delay:150ms}.ni:nth-child(5){animation-delay:200ms}.ni:nth-child(6){animation-delay:250ms}.ni:nth-child(7){animation-delay:300ms}.ni:nth-child(8){animation-delay:350ms}
@media print{.sb,.stg,.sp,.so{display:none!important}.pw{grid-template-columns:1fr}}
/* ===== 第四部分：融资事件检索 ===== */
.fin{max-width:calc(var(--mw) + var(--sw) + var(--x2) + var(--xl)*2);margin:0 auto;padding:0 var(--xl) var(--lg);display:flex;flex-direction:column;gap:var(--md)}
.fin-hd{display:flex;align-items:baseline;gap:var(--md);padding:var(--lg) 0 var(--sm);border-bottom:2px solid var(--ink)}
.fin-hd h2{font-family:"Noto Serif SC",serif;font-size:var(--tx2);font-weight:900;letter-spacing:.06em;color:var(--ink)}
.fin-hd h2 em{font-style:normal;background:linear-gradient(90deg,var(--at),var(--ae));-webkit-background-clip:text;background-clip:text;color:transparent}
.fin-hd .fsu{font-size:var(--ts);color:var(--ink3)}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sm);padding:var(--md) 0}
.fi{position:relative}
.fbtn{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font-size:var(--ts);color:var(--ink);cursor:pointer;min-width:118px;justify-content:space-between;font-family:inherit;transition:border-color var(--df) var(--ee)}
.fbtn:hover,.fi.open .fbtn{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in oklab,var(--ac) 15%,transparent)}
.fbtn .lbl{color:var(--ink3)}.fbtn .val{color:var(--ink);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn .arr{font-size:9px;color:var(--ink3);transition:transform .2s}.fi.open .arr{transform:rotate(180deg)}
.dd{position:absolute;top:calc(100% + 6px);left:0;z-index:80;background:var(--sf);border:1px solid var(--bd);border-radius:var(--md);box-shadow:var(--shl);min-width:230px;max-height:340px;overflow:auto;padding:6px}
.dd label{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:var(--ts);color:var(--ink)}
.dd label:hover{background:color-mix(in oklab,var(--ac) 8%,transparent)}
.dd label input{accent-color:var(--ac)}
.dd .dd-hd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:var(--tx);color:var(--ink3);border-bottom:1px solid var(--bdl);margin-bottom:4px}
.fclear{background:none;border:none;color:var(--ac);cursor:pointer;font-size:var(--tx);font-family:inherit}
/* Calendar */
.cal{width:300px;padding:10px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-nav button{background:none;border:1px solid var(--bd);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--ink);font-size:14px}
.cal-nav button:hover{border-color:var(--ac);color:var(--ac)}
.cal-title{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--ink)}
.cal-title .cy{cursor:pointer;color:var(--ink)}.cal-title .cm{cursor:pointer}
.cal-title .cy:hover,.cal-title .cm:hover{color:var(--ac)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .cw2{font-size:11px;color:var(--ink3);padding:4px 0}
.cal-grid button{background:none;border:none;border-radius:6px;height:30px;cursor:pointer;font-size:12px;color:var(--ink);font-family:inherit}
.cal-grid button:hover{background:color-mix(in oklab,var(--ac) 12%,transparent)}
.cal-grid button.sel{background:var(--ac);color:var(--sf);font-weight:700}
.cal-grid button.in{background:color-mix(in oklab,var(--ac) 16%,transparent)}
.cal-grid button.dim{color:var(--ink3)}
.cal-ym{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cal-ym button{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 0;cursor:pointer;font-size:13px;color:var(--ink);font-family:inherit}
.cal-ym button:hover{border-color:var(--ac);color:var(--ac)}
.cal-yr{display:flex;align-items:center;justify-content:space-between;padding:10px 4px}
.cal-yr button{background:none;border:1px solid var(--bd);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--ink);font-size:14px}
.cal-yr button:hover{border-color:var(--ac);color:var(--ac)}
.cal-yr .yr{font-size:18px;font-weight:700;cursor:pointer;color:var(--ink);padding:0 8px}
.cal-yr .yr:hover{color:var(--ac)}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdl)}
.range-tip{font-size:var(--tx);color:var(--ink2)}.range-tip b{color:var(--ac)}
/* Result & list */
.rmeta{display:flex;align-items:center;gap:var(--sm);padding:4px 0 10px;font-size:var(--ts);color:var(--ink3);border-bottom:1px solid var(--bdl)}
.rmeta b{color:var(--ac);font-size:15px}
.elist{display:flex;flex-direction:column;gap:var(--sm)}
.ev{display:flex;gap:var(--md);background:var(--sf);border:1px solid var(--bd);border-radius:var(--md);padding:var(--md) var(--lg);box-shadow:var(--shs);transition:transform var(--df) var(--ee),box-shadow var(--df) var(--ee)}
.ev:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.ev .ebody{flex:1;min-width:0}
.ev .etop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev .ename{font-size:var(--tm);font-weight:700;color:var(--ink)}
.ev .edate{font-size:var(--tx);color:var(--ink3);background:var(--pp);border:1px solid var(--bdl);padding:1px 8px;border-radius:20px}
.ev .eround{font-size:var(--tx);padding:1px 8px;border-radius:20px;font-weight:600}
.ev .edesc{font-size:var(--ts);color:var(--ink2);margin:4px 0 8px}
.ev .etags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ev .etag{font-size:var(--tx);padding:1px 8px;border-radius:4px}
.ev .eamount{font-size:var(--ts);font-weight:700;color:var(--ac)}
.ev .einvest{font-size:var(--ts);color:var(--ink3);margin-top:4px}
.ev .einvest b{color:var(--ink);font-weight:700}
.ev .eprov{font-size:var(--tx);color:var(--at);margin-left:auto}
/* 地区单选（自定义 div 选项） */
.prov-item{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:var(--ts);color:var(--ink);display:flex;align-items:center;gap:8px}
.prov-item:hover{background:color-mix(in oklab,var(--ac) 8%,transparent)}
.prov-item.sel{background:color-mix(in oklab,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}
.prov-item .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink3);flex:0 0 10px}
.prov-item.sel .dot{border-color:var(--ac);background:var(--ac)}
/* 跳页输入 */
.fjump{display:flex;align-items:center;gap:4px}
.fjump input{width:42px;height:30px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--ink);text-align:center;font-size:var(--ts);font-family:inherit}
.fjump input:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
.fjump button{min-width:30px;padding:0 6px}

/* ===== AUTO-REFRESH LOGIC ===== */

/* Check if currently in A-share trading hours (Mon-Fri, 9:30-11:30, 13:00-15:00 Beijing) */
function isTradingHours() {
  var now = new Date();
  var day = now.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
  if (day === 0 || day === 6) return false; // Weekend

  // Convert to Beijing time (UTC+8)
  var bjHour = now.getUTCHours() + 8;
  var bjMin = now.getUTCMinutes();
  var bjTime = bjHour * 60 + bjMin;

  // Morning session: 9:30-11:30 (570-690 min)
  // Afternoon session: 13:00-15:00 (780-900 min)
  return (bjTime >= 570 && bjTime <= 690) || (bjTime >= 780 && bjTime <= 900);
}

/* Refresh stock sector data from East Money API */
function refreshSectors() {
  // push2delay 域名稳定可用；push2 主域名近期返回 rc:102 被风控
  fetch('https://push2delay.eastmoney.com/api/qt/clist/get?pn=1&pz=25&po=1&np=1&fltt=2&invt=2&fid=f62&fs=m:90+t:2+f:!50&fields=f2,f3,f4,f12,f14&_=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.data || !data.data.diff) return;
      var sectors = data.data.diff;
      var list = document.getElementById('sectorList');
      if (!list) return;
      list.innerHTML = '';
      sectors.forEach(function(s) {
        var name = s.f14 || '---';
        var pct = s.f3;
        var cls = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat');
        var sign = pct > 0 ? '+' : '';
        var txt = (pct != null) ? (sign + pct.toFixed(2) + '%') : '---';
        var li = document.createElement('li');
        li.className = 'sei';
        li.innerHTML = '<span class="sen" title="' + name + '">' + name + '</span><span class="sec ' + cls + '">' + txt + '</span>';
        list.appendChild(li);
      });
      // 更新时间戳，直观显示刷新已生效
      var upd = document.getElementById('sectorUpd');
      if (upd) {
        var d = new Date();
        var hh = ('0' + (d.getUTCHours() + 8) % 24).slice(-2);
        var mm = ('0' + d.getUTCMinutes()).slice(-2);
        var ss = ('0' + d.getUTCSeconds()).slice(-2);
        upd.textContent = '更新于 ' + hh + ':' + mm + ':' + ss;
      }
    })
    .catch(function(e) { console.warn('Stock refresh failed:', e); });
}

/* Stock refresh loop: refresh on load always (get latest close data), every 60s during trading hours */
var sectorRefreshTimer = null;
var lastSectorRefresh = 0; // 非交易时段节流：每 5 分钟最多刷新一次
function manageStockRefresh() {
  if (isTradingHours()) {
    if (!sectorRefreshTimer) {
      sectorRefreshTimer = setInterval(refreshSectors, 60000);
      refreshSectors(); // immediate first refresh
      console.log('[每日一报] 开盘时段，启动板块数据每分钟刷新');
    }
  } else {
    if (sectorRefreshTimer) {
      clearInterval(sectorRefreshTimer);
      sectorRefreshTimer = null;
      console.log('[每日一报] 非开盘时段，暂停定时刷新');
    }
    // 非交易时段也刷新一次：拿到当日收盘的板块数据（而不是显示静态兜底）
    var now = Date.now();
    if (now - lastSectorRefresh > 300000) {
      lastSectorRefresh = now;
      refreshSectors();
    }
  }
}

/* Check every 5 seconds if we entered/left trading hours */
var tradingCheckTimer = setInterval(manageStockRefresh, 5000);
manageStockRefresh(); // immediate check

/* Daily noon refresh: reload the page at 12:00 to get fresh news */
function scheduleNoonRefresh() {
  var now = new Date();
  var bjHour = now.getUTCHours() + 8;
  var bjMin = now.getUTCMinutes();
  var bjSec = now.getUTCSeconds();
  var nowMs = bjHour * 3600000 + bjMin * 60000 + bjSec * 1000;
  var noonMs = 12 * 3600000; // 12:00:00

  var msUntilNoon = noonMs - nowMs;
  if (msUntilNoon < 0) {
    // Already past noon, schedule for tomorrow
    msUntilNoon += 24 * 3600000;
  }

  // Add a small random offset (0-5 min) to avoid thundering herd
  msUntilNoon += Math.floor(Math.random() * 300000);

  setTimeout(function() {
    console.log('[每日一报] 12:00 每日刷新');
    location.reload();
  }, msUntilNoon);
}
scheduleNoonRefresh();

})();

<script>
/* ===== 第四部分：融资事件检索 ===== */
var fin = (function(){
  var FD = window.__FINANCING_DATA__ || {list:[],industries:[],rounds:[],provinces:[]};
  var FILTER = {dateRange:null, industries:{}, rounds:{}, province:''};
  var dateSel = [null,null];
  var calView = {y:2026, m:6, mode:'day'};
  var MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var PAGE_SIZE = 10;
  var page = 1, totalPages = 1;

  var el = {};
  function E(id){ return document.getElementById(id); }

  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function pad(n){return String(n).padStart(2,'0');}

  function toggle(id){
    var f = E(id);
    var open = f.classList.toggle('open');
    var fis = document.querySelectorAll('#financing .fi');
    for(var i=0;i<fis.length;i++){ if(fis[i].id!==id) fis[i].classList.remove('open'); }
    var dds = document.querySelectorAll('#financing .dd');
    for(var i=0;i<dds.length;i++){ dds[i].style.display='none'; }
    if(open){
      var panel = id==='fiTime'?el.calPanel:id==='fiInd'?el.indPanel:id==='fiRound'?el.roundPanel:el.provPanel;
      if(id==='fiTime') renderCal();
      panel.style.display='block';
    }
  }
  document.addEventListener('click', function(e){
    if(!e.target.closest('#financing .fi')){
      var fis = document.querySelectorAll('#financing .fi');
      for(var i=0;i<fis.length;i++) fis[i].classList.remove('open');
    }
  });

  /* ---- 行业/轮次多选面板 ---- */
  function buildMulti(panelId, items, selObj){
    var html = '<div class="dd-hd"><span>可多选</span><button class="fclear" onclick="fin.clearSel(\''+panelId+'\')">清空</button></div>';
    html += items.map(function(it){
      var checked = selObj[it] ? 'checked' : '';
      return '<label><input type="checkbox" '+checked+' onchange="fin.togSel(\''+panelId+'\',this,\''+it.replace(/'/g,"\\'")+'\')">'+it+'</label>';
    }).join('');
    E(panelId).innerHTML = html;
  }
  function togSel(panelId, chk, val){
    var s = panelId==='finIndPanel'?FILTER.industries:FILTER.rounds;
    if(chk.checked) s[val]=1; else delete s[val];
    page = 1;
    apply();
  }
  function clearSel(panelId){
    if(panelId==='finIndPanel') FILTER.industries={}; else FILTER.rounds={};
    buildMulti(panelId, panelId==='finIndPanel'?FD.industries:FD.rounds, panelId==='finIndPanel'?FILTER.industries:FILTER.rounds);
    page = 1;
    apply();
  }

  /* ---- 日历：年（左右切+点数字确认）/月（12格）/日 ---- */
  function renderCal(){
    var y = calView.y, m = calView.m;
    var html = '<div class="cal">';
    if(calView.mode==='day'){
      html += '<div class="cal-nav">'+
        '<button onclick="fin.calNav(-1)">‹</button>'+
        '<div class="cal-title"><span class="cy" onclick="fin.calMode(\'year\')">'+y+'年</span><span class="cm" onclick="fin.calMode(\'month\')">'+MONTHS[m]+'</span></div>'+
        '<button onclick="fin.calNav(1)">›</button></div>';
      var first = new Date(y,m,1), sd = first.getDay(), days = new Date(y,m+1,0).getDate();
      html += '<div class="cal-grid">'+['日','一','二','三','四','五','六'].map(function(w){return '<span class="cw2">'+w+'</span>';}).join('');
      for(var i=0;i<sd;i++) html += '<span></span>';
      for(var d=1; d<=days; d++){
        var ds = y+'-'+pad(m+1)+'-'+pad(d);
        var cls = '';
        if(dateSel[0] && ds===dateSel[0]) cls+=' sel';
        else if(dateSel[1] && ds===dateSel[1]) cls+=' sel';
        else if(dateSel[0] && dateSel[1] && ds>dateSel[0] && ds<dateSel[1]) cls+=' in';
        html += '<button class="'+cls.trim()+'" onclick="fin.pickDate(\''+ds+'\')">'+d+'</button>';
      }
      html += '</div>';
      var tip = dateSel[0] ? (dateSel[0]+' ~ '+(dateSel[1]||'选择结束')) : '点击两次选择起止范围';
      html += '<div class="cal-foot"><span class="range-tip">'+tip+'</span><button class="fclear" onclick="fin.clearDate()">清空</button></div>';
    } else if(calView.mode==='year'){
      html += '<div class="cal-yr"><button onclick="fin.calY(-1)">‹</button><span class="yr" onclick="fin.calMode(\'day\')">'+y+'</span><button onclick="fin.calY(1)">›</button></div>';
    } else {
      html += '<div class="cal-nav"><div class="cal-title">'+y+'年</div></div><div class="cal-ym">';
      MONTHS.forEach(function(mn,i){ html += '<button onclick="fin.calMode(\'day\','+y+','+i+')">'+mn+'</button>'; });
      html += '</div>';
    }
    html += '</div>';
    el.calPanel.innerHTML = html;
  }
  function calNav(d){
    if(calView.mode!=='day') return;
    var nm = calView.m + d;
    if(nm<0){nm=11;calView.y--;} else if(nm>11){nm=0;calView.y++;}
    calView.m = nm; renderCal();
  }
  function calY(d){ calView.y += d; renderCal(); }
  function calMode(mode, y, m){
    calView.mode = mode;
    if(y) calView.y = y;
    if(m!==undefined) calView.m = m;
    renderCal();
  }
  function pickDate(ds){
    var a = dateSel[0], b = dateSel[1];
    if(!a || (a&&b)) dateSel = [ds,null];
    else {
      if(ds < a) dateSel = [ds,a]; else dateSel[1] = ds;
    }
    if(dateSel[0] && dateSel[1]){
      FILTER.dateRange = dateSel.slice();
      el.timeLbl.textContent = dateSel[0]+' ~ '+dateSel[1];
      el.timeLbl.classList.add('val');
      page = 1;
      apply();
    }
    renderCal();
  }
  function clearDate(){
    dateSel=[null,null]; FILTER.dateRange=null;
    el.timeLbl.textContent='融资时间';
    el.timeLbl.classList.remove('val');
    page = 1;
    apply(); renderCal();
  }

  /* ---- 地区（div 单选项：手动互斥 + 点击已选中项可取消） ---- */
  function buildProv(){
    var items = ['中国'].concat(FD.provinces.filter(function(p){return p!=='中国';}));
    E('finProvPanel').innerHTML = items.map(function(p){
      var sel = FILTER.province===p ? ' sel' : '';
      return '<div class="prov-item'+sel+'" onclick="fin.selProv(\''+p+'\')"><span class="dot"></span>'+p+'</div>';
    }).join('');
  }
  function selProv(p){
    if(FILTER.province===p){
      FILTER.province = '';
      el.provLbl.textContent='所在地区';
      el.provLbl.classList.remove('val');
    } else {
      FILTER.province = p;
      el.provLbl.textContent = p;
      el.provLbl.classList.add('val');
    }
    page = 1;
    apply();
    buildProv();
  }

  /* ---- 筛选、分页与渲染 ---- */
  function apply(){
    var all = FD.list.filter(function(it){
      if(FILTER.dateRange && (it.date < FILTER.dateRange[0] || it.date > FILTER.dateRange[1])) return false;
      var ik = Object.keys(FILTER.industries);
      if(ik.length && !it.industry.some(function(i){return FILTER.industries[i];})) return false;
      var rk = Object.keys(FILTER.rounds);
      if(rk.length && !rk.some(function(r){return r===it.round;})) return false;
      if(FILTER.province && FILTER.province!=='中国' && it.province!==FILTER.province) return false;
      return true;
    });
    totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if(page > totalPages) page = totalPages;
    el.cnt.textContent = all.length;
    renderList(all.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE));
    renderPager();
  }
  function renderList(list){
    var html = '';
    list.forEach(function(it){
      var indTags = it.industry.slice(0,3).map(function(i,idx){
        var cols = [['rgba(192,57,43,.08)','#c0392b'],['rgba(24,95,165,.08)','#185fa5'],['rgba(59,109,17,.08)','#3b6d11']];
        return '<span class="etag" style="background:'+cols[idx%3][0]+';color:'+cols[idx%3][1]+'">'+i+'</span>';
      }).join('');
      var rc = {'天使轮':'#c0392b','种子轮':'#b05b3c','A轮':'#185fa5','A+轮':'#185fa5','A++轮':'#185fa5','B轮':'#3b6d11','B+轮':'#3b6d11','C轮':'#1a6e58','F轮':'#50358f','Pre-A轮':'#a8601a','Pre-IPO':'#8f2f5e','IPO':'#2c2c2a','股权融资':'#7a3a22','战略融资':'#50358f','定向增发':'#2b6b2b','天使+':'#c0392b'}[it.round]||'#5f5e5a';
      var dispProv = (FILTER.province==='中国') ? '中国' : it.province;
      html += '<div class="ev" style="cursor:default">'+
        '<div class="ebody"><div class="etop"><span class="ename">'+it.name+'</span><span class="edate">'+it.date+'</span><span class="eround" style="background:'+rc+'14;color:'+rc+'">'+it.round+'</span><span class="eprov">'+dispProv+'</span></div>'+
        '<div class="edesc">'+it.desc+'</div><div class="etags">'+indTags+'</div>'+
        '<div class="eamount">'+(it.amount!=='未透露'?it.amount:'金额未透露')+'</div>'+
        '<div class="einvest"><b>投资方：</b>'+(it.investors!=='未透露'?it.investors:'未透露')+'</div></div></div>';
    });
    el.list.innerHTML = html || '<div class="fempty"><div class="big">🔍</div>没有符合条件的融资事件<br>试试调整筛选条件</div>';
  }
  function renderPager(){
    var pager = el.list.parentNode.querySelector('.fpage');
    if(totalPages<=1){ if(pager) pager.remove(); return; }
    if(!pager){ pager = document.createElement('div'); pager.className='fpage'; el.list.parentNode.insertBefore(pager, el.list.nextSibling); }
    var html = '<button '+(page<=1?'disabled':'')+' onclick="fin.goPage('+(page-1)+')">‹</button>';
    var dots = false;
    for(var i=1;i<=totalPages;i++){
      if(totalPages>7 && i>2 && i<totalPages-1 && Math.abs(i-page)>1){ if(!dots){ html+='<span class="finfo">…</span>'; dots=true; } continue; }
      html += '<button class="'+(i===page?'cur':'')+'" onclick="fin.goPage('+i+')">'+i+'</button>';
    }
    html += '<button '+(page>=totalPages?'disabled':'')+' onclick="fin.goPage('+(page+1)+')">›</button>';
    html += '<span class="finfo">'+page+' / '+totalPages+'</span>';
    html += '<span class="fjump"><input id="finJumpInput" type="number" min="1" max="'+totalPages+'" placeholder="页" aria-label="跳转到第几页"><button onclick="fin.jumpPage()">跳转</button></span>';
    pager.innerHTML = html;
    var ji = E('finJumpInput');
    if(ji){ ji.addEventListener('keydown', function(e){ if(e.key==='Enter') fin.jumpPage(); }); }
  }
  function goPage(p){
    if(p<1||p>totalPages) return;
    page = p;
    apply();
    var sec = E('financing');
    if(sec) sec.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  function jumpPage(){
    var inp = E('finJumpInput');
    if(!inp) return;
    var p = parseInt(inp.value, 10);
    if(isNaN(p)) return;
    inp.value = '';
    goPage(p);
  }

  function reset(){
    FILTER = {dateRange:null, industries:{}, rounds:{}, province:''};

    el.timeLbl.textContent='融资时间';

    el.roundLbl.textContent='轮次';
    el.provLbl.textContent='所在地区';
    [el.timeLbl,el.indLbl,el.roundLbl,el.provLbl].forEach(function(x){x.classList.remove('val');});
    buildMulti('finIndPanel', FD.industries, FILTER.industries);
    buildMulti('finRoundPanel', FD.rounds, FILTER.rounds);
    buildProv(); renderCal(); apply();
  }

  function init(){
    el.timeLbl = E('finTimeLbl'); el.indLbl = E('finIndLbl'); el.roundLbl = E('finRoundLbl'); el.provLbl = E('finProvLbl');
    el.cnt = E('finCnt'); el.list = E('finList');
    el.calPanel = E('finCalPanel'); el.indPanel = E('finIndPanel'); el.roundPanel = E('finRoundPanel'); el.provPanel = E('finProvPanel');
    var now = new Date();
    var start = new Date(now); start.setDate(start.getDate()-120);
    dateSel = [fmt(start), fmt(now)];
    FILTER.dateRange = dateSel.slice();
    el.timeLbl.textContent = dateSel[0]+' ~ '+dateSel[1];
    el.timeLbl.classList.add('val');
    buildMulti('finIndPanel', FD.industries, FILTER.industries);
    buildMulti('finRoundPanel', FD.rounds, FILTER.rounds);
    buildProv(); apply();
  }
  init();

  /* ---- 每小时自动刷新融资数据（增量由 GitHub Actions 每小时抓取） ---- */
  function scheduleDataRefresh(){
    setInterval(function(){
      fetch('financing-data.js?t=' + Date.now(), {cache:'no-store'})
        .then(function(r){ return r.text(); })
        .then(function(txt){
          var ns = {};
          try {
            new Function('window', txt).call({}, { __D__: null }); // 占位不可用，直接用 eval 替代
          } catch(e){}
          // 用正则提取 JSON 部分解析
          var m = txt.match(/window\.__FINANCING_DATA__ = ([\s\S]*);$/);
          if(!m) return;
          var nd = JSON.parse(m[1]);
          if(nd && nd.list && nd.list.length){
            FD = {list:nd.list, industries:nd.industries, rounds:nd.rounds, provinces:nd.provinces, updated:nd.updated};
            // 重建筛选面板选项（保持原选项尽量保留）
            var curInd = Object.keys(FILTER.industries), curRound = Object.keys(FILTER.rounds);
            buildMulti('finIndPanel', FD.industries, FILTER.industries);
            buildMulti('finRoundPanel', FD.rounds, FILTER.rounds);
            buildProv();
            apply();
            var up = document.getElementById('finUpdated');
            if(up) up.textContent = '更新于 ' + (nd.updated||'');
          }
        }).catch(function(){});
    }, 3600000); // 每小时
  }
  scheduleDataRefresh();


  return { toggle:toggle, togSel:togSel, clearSel:clearSel, calNav:calNav, calY:calY, calMode:calMode, pickDate:pickDate, clearDate:clearDate, selProv:selProv, goPage:goPage, jumpPage:jumpPage, reset:reset };
})();
</script>
})();
</script>

/* 设置面板页面导航 */
function goSection(sel){
  var sp = document.getElementById('settingsPanel'), so = document.getElementById('settingsOverlay');
  if(sp) sp.classList.remove('is-open');
  if(so) so.classList.remove('is-visible');
  var el = document.querySelector(sel);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
